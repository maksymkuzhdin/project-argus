# Ukraine-Specific Cohort Taxonomy Configuration
#
# This file contains:
# 1. Seed institution list for fuzzy matching
# 2. Keyword mappings for sector and government_level classification
# 3. Configuration parameters for cohort building

# ============================================================================
# SEED INSTITUTION LIST
# ============================================================================
# Canonical Ukrainian government, public, and major institutions for fuzzy
# matching against raw work_place, source_name, and organization fields.
# Each entry includes:
#   - canonical_name: Official name used in normalized cohorts
#   - aliases: Common variations, abbreviations, suffixes
#   - institution_type: Category (judiciary, healthcare, education, local_government, central_government, state_enterprise, law_enforcement, security, defense, media_culture, science, agriculture, unknown)
#   - edrpou: Optional Ukrainian business ID for validation
#
# The institution normalizer will:
# 1. Try fuzzy matching (edit distance + keyword overlap) to find a seed entry
# 2. If no match found, extract type from raw name keywords
# 3. If neither works, record as 'unknown' (for manual review queue)

