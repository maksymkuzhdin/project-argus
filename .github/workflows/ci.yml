name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: pytest app/tests -q -m "not db_integration"

      - name: Run backend DB integration tests
        env:
          ARGUS_REQUIRE_DB_TESTS: "1"
        run: pytest app/tests -q -m "db_integration"

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    needs:
      - backend-tests
      - frontend-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start backend in background
        working-directory: backend
        run: |
          set -euo pipefail
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          backend_pid=$!
          echo "Started backend (PID: ${backend_pid})"

          trap 'echo "Backend startup failed; tailing backend.log"; if [ -f backend.log ]; then tail -n 200 backend.log; fi' ERR

          for i in {1..30}; do
            if curl -sSf http://localhost:8000/api/declarations/stats >/dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            if ! kill -0 "${backend_pid}" 2>/dev/null; then
              echo "Backend process exited early"
              if [ -f backend.log ]; then
                tail -n 200 backend.log
              fi
              exit 1
            fi
            sleep 1
          done
          echo "Backend failed to become ready in time"
          if [ -f backend.log ]; then
            tail -n 200 backend.log
          fi
          exit 1

      - name: Run e2e smoke tests
        env:
          INTERNAL_API_URL: http://localhost:8000
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_E2E_FIXTURES: "1"
        run: npm run e2e

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 30

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload backend startup log
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-startup-log
          path: backend/backend.log
          retention-days: 30
