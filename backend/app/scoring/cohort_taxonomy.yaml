# ============================================================================
# SECTOR KEYWORD MAPPINGS
# ============================================================================
# Map post_type values (from Ukrainian e-declarations) to normalized sectors
# via keyword matching. Each sector lists Ukrainian keywords that identify it.
# The mapper will:
# 1. Split post_type into words
# 2. Check if any keyword matches (case-insensitive)
# 3. First match wins (listed in priority order)
# 4. If no match, sector = "other"

sector_keywords:
  healthcare:
    - ["МЕДИК", "ЛІКАР", "ОХОРОНА ЗДОРОВ'Я", "ЗДОРОВ'Я"]
  judiciary:
    - ["СУД", "ПРОКУРАТУР", "АДВОКАТ", "СУДД"]
  education:
    - ["ОСВІТ", "НАУК", "ШКОЛ", "ВИКЛАДАЧ", "УНИВЕРСИТ"]
  local_government:
    - ["МІСЦЕВОМ САМОВРЯД", "РАДА", "МЕРІЯ", "КОМІТЕТ"]
  central_government:
    - ["ЦЕНТР", "ДЕРЖАВН", "МІНІСТЕРСТВ", "РЯДОВИ СЛУЖБ"]
  security_defense:
    - ["БЕЗПЕК", "ОБОРОН", "ПОЛІЦ", "ВІЙСЬКОВ", "ГВ"]
  state_enterprise:
    - ["ПІДПРИЄМСТВ", "КОМУНАЛЬН", "АКЦІОНЕР"]
  media_culture:
    - ["МЕДІА", "ТЕЛЕ", "РАДІО", "КУЛЬТУР", "МИСТЕЦ"]
  science:
    - ["НАУК", "ДОСЛІД", "ІНСТИТУТ"]
  agriculture:
    - ["АГР", "ЗЕМЛ", "СІЛЬСЬК"]
  # anything else falls through to "other"

# ============================================================================
# GOVERNMENT LEVEL KEYWORD MAPPINGS
# ============================================================================
# Map post_type + post_category to normalized government levels.
# These keyword lists identify the institutional tier (central vs. local, etc.)

government_level_keywords:
  local:
    - ["МІСЦЕВОМ САМОВРЯД", "МІСЦЕВА", "СЕЛИЩ", "СІЛЬСЬК", "РАЙОНН", "ОБЛАСН"]
  central:
    - ["ЦЕНТР", "ДЕРЖАВН", "МІНІСТЕРСТВ", "ВЕРХОВН", "ПАРЛАМЕНТ"]
  state_enterprise:
    - ["КОМУНАЛЬН", "ДЕРЖАВН ПІДПРИЄМСТВ", "АКЦІОНЕР"]
  commission:
    - ["ВЛК", "ЛЛК", "МСЕК", "КОМІСІЯ"]
  # anything else falls through to "other"

# ============================================================================
# COHORT BUILDER CONFIGURATION
# ============================================================================

cohort_configuration:
  # Minimum number of declarations required for a cohort before fallback
  min_cohort_size: 30
  
  # Confidence threshold for role_family and institution_family normalization
  # Values below this are flagged for manual review
  min_mapping_confidence: 0.60
  
  # Maximum edit distance (Levenshtein) for institution fuzzy matching
  max_edit_distance: 5
  
  # Minimum overlap score (Jaccard/keyword) for institution matching
  min_overlap_score: 0.3
  
  # URL or path to manual curation notes (for future feature)
  # manual_curation_file: "output/cohort_mappings_curated.yaml"
